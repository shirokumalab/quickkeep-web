<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickKeep</title>
  <meta name="description" content="QuickKeepの公式情報ページです。">
  <style>
    :root {
      color-scheme: light dark;
      --accent: #35b99a;
      --text: #17201d;
      --muted: #68736f;
      --bg: #f7f9f8;
      --card: #ffffff;
      --line: #e3e9e6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #edf5f2;
        --muted: #a9b6b1;
        --bg: #111614;
        --card: #19201d;
        --line: #2b3531;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.75;
    }
    main {
      width: min(880px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }
    header, section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 18px;
    }
    h1, h2 { line-height: 1.25; margin: 0 0 12px; }
    p { margin: 0 0 12px; color: var(--muted); }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
    nav a {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      background: color-mix(in srgb, var(--accent) 9%, transparent);
    }
    footer {
      color: var(--muted);
      font-size: 13px;
      padding: 8px 2px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>QuickKeep</h1>
      <p>あとで見つかる、かんたん保存。</p>
      <nav aria-label="QuickKeep関連ページ">
        <a href="./guide/">使い方</a>
        <a href="./support/">サポート・FAQ</a>
        <a href="./terms/">利用規約</a>
        <a href="./privacy/">プライバシーポリシー</a>
        <a href="./commerce/">特定商取引法に基づく表記</a>
      </nav>
    </header>

    <section>
      <h2>このページについて</h2>
      <p>QuickKeepの公開情報を掲載するための準備ページです。本文は公開前に確定します。</p>
    </section>

    <footer>© QuickKeep</footer>
  </main>
</body>
</html>
